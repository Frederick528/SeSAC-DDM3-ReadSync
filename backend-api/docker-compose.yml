services:
  # --- Redis (채팅 저장소) ---
  redis:
    image: redis:alpine
    container_name: readsync-redis
    ports: ["6379:6379"]
    # 데이터 안전 저장 (60초마다 변경사항 있으면 저장)
    command: redis-server --save 60 1 --loglevel warning
    networks: [app-network]

  # --- Master DB (쓰기 전용) ---
  pg-master:
    platform: linux/amd64  # 맥북 호환성 치트키
    build: .               # 현재 폴더의 Dockerfile로 빌드
    image: readsync-postgres-pgvector:dev # 빌드된 이미지 이름표
    container_name: readsync-pg-master
    ports: ["5432:5432"]
    environment:
      - TZ=Asia/Seoul
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=readsync
      - POSTGRESQL_DATABASE=LoRdb
    volumes:
      - ./data/master:/bitnami/postgresql
    # [핵심] 마스터가 진짜 준비됐는지 스스로 체크함
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d LoRdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app-network]

  # --- Slave DB (읽기/검색 전용) ---
  pg-slave:
    platform: linux/amd64
    image: readsync-postgres-pgvector:dev # 마스터가 만든 그 이미지 재사용
    container_name: readsync-pg-slave
    ports: ["5433:5432"]
    # [핵심] 마스터가 healthcheck 통과할 때까지 대기
    depends_on:
      pg-master:
        condition: service_healthy
    environment:
      - TZ=Asia/Seoul
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_MASTER_HOST=pg-master
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_PASSWORD=readsync
    volumes:
      - ./data/slave:/bitnami/postgresql
    networks: [app-network]

# 네트워크 정의
networks:
  app-network:
    driver: bridge