name: Deploy to EB

on:
  push:
    branches: [ "main", "develop" ] # main 브랜치에 푸시하면 배포 시작!

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 내 코드 가져오기
      - uses: actions/checkout@v3

      # 2. 자바 세팅 (JDK 17) - 본인 버전에 맞게 수정
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto'

      # 3. gradlew 권한 주기
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 빌드하기 (테스트 제외 - 빨리 배포하려고)
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 5. EB 배포용 파일 모으기 (Dockerfile + Jar 파일)
      # Dockerfile은 루트에, jar는 build/libs에 있는 구조 그대로 압축해야 함
      - name: Generate deployment package
        run: |
          mkdir deploy
          cp Dockerfile deploy/
          cp -r build/libs deploy/
          cp src/main/resources/application-prod.yml deploy/ 2>/dev/null || : # 있으면 복사, 없으면 무시
          cd deploy && zip -r deploy.zip .

      # ---------------------------------------------------
      # 여기서부터 중요! 브랜치별로 갈라치기
      # ---------------------------------------------------

      # 1. develop 브랜치일 때 -> Dev 환경으로 배포
      - name: Deploy to DEV Environment
        if: github.ref == 'refs/heads/develop'
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: readsync-server
          environment_name: Readsync-dev-env       # ⚠️ Dev용 환경 이름 (새로 만든 거)
          version_label: dev-${{github.run_number}}
          region: ap-northeast-2
          deployment_package: deploy/deploy.zip

      # 2. main 브랜치일 때 -> Prod 환경으로 배포
      - name: Deploy to PROD Environment
        if: github.ref == 'refs/heads/main'
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: readsync-server
          environment_name: Readsync-server-env    # ⚠️ Prod용 환경 이름 (아까 만든 거)
          version_label: prod-${{github.run_number}}
          region: ap-northeast-2
          deployment_package: deploy/deploy.zip